<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NİGAR MÜƏLLİM - Azərbaycan dili və ədəbiyyatı</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-main: #f8f6f2; --card-bg: #ffffff; --primary: #8c6d53; --primary-dark: #6e523c; --text-dark: #2c2825; --text-muted: #7a736e; --accent-bg: #f3ece4; --radius-lg: 20px; --radius-md: 16px; --radius-sm: 12px; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-dark); padding: 15px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { display: flex; flex-direction: column; gap: 15px; padding: 10px 0 20px 0; align-items: center; text-align: center; }
        .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.1rem; cursor: pointer; }
        .logo i { font-size: 1.6rem; color: var(--primary); }
        .logo-text span { display: block; font-size: 0.75rem; font-weight: 400; color: var(--text-muted); }
        nav { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        nav a { text-decoration: none; color: var(--text-dark); font-weight: 500; font-size: 0.85rem; padding: 6px 12px; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        nav a.active, nav a:hover { color: var(--primary); font-weight: 700; background: var(--accent-bg); }
        .page-section { display: none; }
        .page-section.active { display: block; }
        .hero { background: linear-gradient(135deg, #f5efe9 0%, #ebe2d8 100%); border-radius: var(--radius-lg); padding: 25px 15px; margin-bottom: 20px; text-align: center; }
        .btn { padding: 8px 18px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
        .btn-primary { background: var(--primary); color: white; }
        .lessons-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .lesson-card-item { background: var(--card-bg); border-radius: var(--radius-md); padding: 18px; border: 1px solid #f0e9e1; cursor: pointer; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); align-items: center; justify-content: center; padding: 15px; }
        .modal-content { background: white; padding: 20px; border-radius: var(--radius-md); width: 100%; max-width: 700px; position: relative; }
        .video-container { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; background: #000; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .quiz-card { background: var(--card-bg); border-radius: var(--radius-md); padding: 20px; border: 1px solid #f0e9e1; margin-bottom: 15px; }
        .quiz-option { background: #fdfbf7; padding: 12px; border-radius: var(--radius-sm); margin-top: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
    </style>
</head>
<body>
    <div id="lockScreen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f8f6f2; z-index: 9999; display: flex; align-items: center; justify-content: center;">
        <div style="background: white; padding: 30px; border-radius: 16px; width: 300px; text-align: center;">
            <input type="text" id="accessCode" placeholder="Dəvət kodu..." style="width:100%; padding:12px; margin-bottom:15px; border: 1px solid #e0d8cf; border-radius: 8px;">
            <button class="btn btn-primary" style="width:100%" onclick="checkCode()">Daxil ol</button>
        </div>
    </div>

    <div class="container" id="mainContainer" style="display: none;">
        <header>
            <div class="logo" onclick="showPage('home')"><i class="fa-solid fa-book-open"></i> NİGAR MÜƏLLİM</div>
            <nav>
                <a id="nav-home" class="active" onclick="showPage('home')">Ana səhifə</a>
                <a id="nav-lessons" onclick="showPage('lessons')">Dərslər</a>
                <a id="nav-quiz" onclick="showPage('quiz')">Test</a>
            </nav>
        </header>

        <div id="home-page" class="page-section active">
            <section class="hero"><h1>Azərbaycan dili dərsləri</h1></section>
        </div>

        <div id="lessons-page" class="page-section">
            <div class="lessons-grid" id="lessons-list"></div>
        </div>

        <div id="quiz-page" class="page-section">
            <div id="quiz-questions"></div>
            <button class="btn btn-primary" onclick="calculateResult()">Nəticəni yoxla</button>
            <div id="result-box" style="display:none; margin-top:20px;"></div>
        </div>
    </div>

    <div id="videoModal" class="modal"><div class="modal-content"><span class="close-modal" onclick="closeVideoModal()" style="float:right; cursor:pointer;">&times;</span><div class="video-container" id="video-frame-container"></div></div></div>

    <script>
        const lessonsData = [
            { title: "Fonetika və Əlifba", class: "5", desc: "Səslər, hərflər, ahəng qanunu.", videoUrl: "" },
            { title: "İsim və onun halları", class: "6", desc: "İsmin mənsubiyyət və hal şəkilçiləri.", videoUrl: "" },
            { title: "Vasitəsiz nitq", class: "9", desc: "Müəllifin sözü və vasitəsiz nitq.", videoUrl: "https://www.youtube.com/embed/93wm0tmbpGQ" }
        ];

        const quizQuestions = [
            { q: "1. “Pərakəndə” sözünün mənası:", options: ["Nizamsız", "Nizamlı", "Düzgün", "Yalan"], correct: 0 },
            { q: "2. “Oxuyasınız” sözü hansı şəkildədir?", options: ["Əmr", "Arzu", "Xəbər", "Lazım"], correct: 1 }
        ];

        function checkCode() {
            if(document.getElementById('accessCode').value === "NIGAR2024") {
                localStorage.setItem("nigar_teacher_auth", "true");
                document.getElementById('lockScreen').style.display = 'none';
                document.getElementById('mainContainer').style.display = 'block';
            }
        }

        window.onload = () => { if(localStorage.getItem("nigar_teacher_auth") === "true") { document.getElementById('lockScreen').style.display = 'none'; document.getElementById('mainContainer').style.display = 'block'; } };

        function showPage(pageName) {
            document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active'));
            if(pageName === 'lessons') {
                document.getElementById('lessons-page').classList.add('active');
                const list = document.getElementById('lessons-list');
                list.innerHTML = '';
                lessonsData.forEach(l => list.innerHTML += `<div class="lesson-card-item" onclick="openVideoModal('${l.title}', '${l.videoUrl}')"><h3>${l.title}</h3><p>${l.desc}</p></div>`);
            } else if(pageName === 'quiz') {
                document.getElementById('quiz-page').classList.add('active');
                renderQuiz();
            } else { document.getElementById('home-page').classList.add('active'); }
        }

        function renderQuiz() {
            const container = document.getElementById('quiz-questions');
            container.innerHTML = '';
            quizQuestions.forEach((item, index) => {
                let opts = item.options.map((opt, i) => `<label class="quiz-option"><input type="radio" name="q${index}" value="${i}"> ${opt}</label>`).join('');
                container.innerHTML += `<div class="quiz-card"><h4>${item.q}</h4>${opts}</div>`;
            });
        }

        function openVideoModal(title, url) {
            if(!url) { alert("Video hələ əlavə olunmayıb."); return; }
            document.getElementById('video-frame-container').innerHTML = `<iframe src="${url}" allowfullscreen></iframe>`;
            document.getElementById('videoModal').style.display = 'flex';
        }
        
        function closeVideoModal() { document.getElementById('videoModal').style.display = 'none'; document.getElementById('video-frame-container').innerHTML = ''; }
        
        function calculateResult() {
            let score = 0;
            quizQuestions.forEach((item, index) => {
                const sel = document.querySelector(`input[name="q${index}"]:checked`);
                if(sel && parseInt(sel.value) === item.correct) score++;
            });
            alert("Nəticəniz: " + score);
        }
    </script>
</body>
</html>
